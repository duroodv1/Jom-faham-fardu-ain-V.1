<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  var swSudahReload = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!swSudahReload) { swSudahReload = true; location.reload(); }
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" }).then(function (r) { r.update(); console.log("SW berdaftar:", r.scope); }).catch(function (e) { console.warn("SW gagal (app tetap berfungsi dalam talian):", e); });
  });
}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredPrompt = e; const b = document.createElement("button"); b.className = "btn btn-gold"; b.textContent = "📲 Pasang Aplikasi pada Peranti Ini"; b.style.cssText = "position:fixed;right:14px;bottom:76px;z-index:80"; b.onclick = async function () { b.remove(); if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; } }; document.body.appendChild(b); setTimeout(function(){ if (b.parentNode) b.remove(); }, 20000); });
</script>
